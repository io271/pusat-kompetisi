<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Pusat Kompetisi</title>
<style>body{font-family:system-ui;max-width:900px;margin:40px auto;padding:20px;background:#f5f7fb}form,.item{background:#fff;padding:20px;border-radius:15px;margin:15px 0}input,select,textarea,button{width:100%;box-sizing:border-box;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}button{cursor:pointer;background:#5b5ce2;color:white;border:0}.danger{background:#d33}.hidden{display:none}.item{display:flex;justify-content:space-between;gap:15px}</style></head>
<body><p><a href="index.html">← Lihat situs publik</a></p><h1>🔐 Panel Admin</h1>
<section id="login"><form onsubmit="login(event)"><h2>Masuk</h2><input id="email" type="email" placeholder="Email admin" required><input id="password" type="password" placeholder="Kata sandi" required><button>Masuk</button><p id="err"></p></form></section>
<section id="panel" class="hidden"><button onclick="logout()">Keluar</button><form onsubmit="save(event)"><h2 id="formtitle">Tambah kompetisi</h2><input id="id" type="hidden"><input id="name" placeholder="Nama kompetisi" required><input id="subject" placeholder="Bidang, mis. Matematika" required><input id="level" placeholder="Tingkat, mis. Nasional"><input id="organizer" placeholder="Penyelenggara"><label>Batas pendaftaran</label><input id="deadline" type="date" required><label>Tanggal kompetisi</label><input id="date" type="date" required><select id="mode"><option>Daring</option><option>Luring</option><option>Hibrida</option></select><input id="fee" placeholder="Biaya"><input id="poster_url" placeholder="URL poster"><input id="link" placeholder="URL pendaftaran/situs"><textarea id="description" placeholder="Deskripsi"></textarea><button>Simpan</button></form><h2>Daftar kompetisi</h2><div id="list"></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const CONFIG={url:"GANTI_SUPABASE_URL",key:"GANTI_SUPABASE_ANON_KEY"};const db=supabase.createClient(CONFIG.url,CONFIG.key);
async function check(){let {data}=await db.auth.getSession();if(data.session){loginUI(true);load()}}check();
function loginUI(ok){login.classList.toggle("hidden",ok);panel.classList.toggle("hidden",!ok)}
async function login(e){e.preventDefault();let {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error)err.textContent=error.message;else{loginUI(true);load()}}
async function logout(){await db.auth.signOut();location.reload()}
async function load(){let {data}=await db.from("competitions").select("*").order("deadline");list.innerHTML=(data||[]).map(c=>`<div class="item"><span><b>${esc(c.name)}</b><br>${esc(c.subject)} · ${esc(c.deadline)}</span><span><button onclick='edit(${JSON.stringify(c)})'>Edit</button><button class="danger" onclick="del('${c.id}')">Hapus</button></span></div>`).join("")}
function esc(x=""){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function edit(c){for(let k of ["id","name","subject","level","organizer","deadline","date","mode","fee","poster_url","link","description"])document.getElementById(k).value=c[k]||"";formtitle.textContent="Edit kompetisi";scrollTo(0,0)}
async function save(e){e.preventDefault();let obj={name:name.value,subject:subject.value,level:level.value,organizer:organizer.value,deadline:deadline.value,date:date.value,mode:mode.value,fee:fee.value,poster_url:poster_url.value,link:link.value,description:description.value};let {error}=id.value?await db.from("competitions").update(obj).eq("id",id.value):await db.from("competitions").insert(obj);if(error)alert(error.message);else{e.target.reset();id.value="";formtitle.textContent="Tambah kompetisi";load()}}
async function del(x){if(confirm("Hapus kompetisi ini?")){let {error}=await db.from("competitions").delete().eq("id",x);if(error)alert(error.message);else load()}}
</script></body></html>
