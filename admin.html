<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Pusat Kompetisi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #11162a;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: white;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .panel {
      background: white;
      border: 1px solid #e2e6ee;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-top: 12px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      border: 1px solid #dfe3eb;
      border-radius: 9px;
      font: inherit;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 15px;
      cursor: pointer;
      font: inherit;
      background: #5b5ce2;
      color: white;
    }

    button.secondary {
      background: #eef0f5;
      color: #172033;
    }

    button.danger {
      background: #d33;
    }

    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      border: 1px solid #e5e8ef;
      border-radius: 11px;
      padding: 13px;
      margin: 9px 0;
    }

    .item-actions {
      display: flex;
      gap: 7px;
    }

    .muted {
      color: #687386;
      font-size: 14px;
    }

    .error {
      color: #c62828;
      margin-top: 10px;
    }

    .success {
      color: #18753c;
      margin-top: 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .item {
        align-items: flex-start;
        flex-direction: column;
      }

      .item-actions {
        width: 100%;
      }

      .item-actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header>
  <strong>🏆 Pusat Kompetisi — Admin</strong>
  <a href="index.html">Lihat situs publik</a>
</header>

<main>

  <!-- LOGIN -->
  <section id="loginPanel" class="panel">

    <h1>🔐 Masuk Admin</h1>

    <p class="muted">
      Masuk untuk menambah, mengubah, atau menghapus kompetisi.
    </p>

    <form id="loginForm">

      <label>
        Email
        <input
          id="loginEmail"
          type="email"
          autocomplete="username"
          required
        >
      </label>

      <label>
        Password
        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
        >
      </label>

      <div class="actions">
        <button type="submit">
          Masuk
        </button>
      </div>

      <div id="loginError" class="error"></div>

    </form>

  </section>


  <!-- ADMIN PANEL -->
  <section id="adminPanel" class="hidden">

    <div class="panel">

      <div
        style="
          display:flex;
          justify-content:space-between;
          gap:10px;
          align-items:center;
        "
      >

        <div>

          <h1 style="margin-bottom:4px">
            Panel Admin
          </h1>

          <span
            id="adminEmail"
            class="muted"
          ></span>

        </div>

        <button
          id="logoutBtn"
          class="secondary"
          type="button"
        >
          Keluar
        </button>

      </div>

    </div>


    <!-- FORM KOMPETISI -->
    <form
      id="competitionForm"
      class="panel"
    >

      <h2 id="formTitle">
        Tambah kompetisi
      </h2>

      <input
        id="competitionId"
        type="hidden"
      >

      <div class="grid">

        <label>
          Nama kompetisi
          <input
            id="name"
            required
          >
        </label>

        <label>
          Bidang / mata pelajaran
          <input
            id="subject"
            required
            placeholder="Contoh: Matematika"
          >
        </label>

        <label>
          Tingkat
          <input
            id="level"
            placeholder="Contoh: Nasional"
          >
        </label>

        <label>
          Penyelenggara
          <input id="organizer">
        </label>

        <label>
          Batas pendaftaran
          <input
            id="deadline"
            type="date"
            required
          >
        </label>

        <label>
          Tanggal kompetisi
          <input
            id="date"
            type="date"
            required
          >
        </label>

        <label>
          Mode

          <select id="mode">
            <option>Daring</option>
            <option>Luring</option>
            <option>Hibrida</option>
          </select>

        </label>

        <label>
          Biaya
          <input
            id="fee"
            placeholder="Gratis / Rp50.000"
          >
        </label>

        <label class="full">
          URL poster

          <input
            id="posterUrl"
            type="url"
            placeholder="https://..."
          >

        </label>

        <label class="full">
          URL pendaftaran / situs

          <input
            id="link"
            type="url"
            placeholder="https://..."
          >

        </label>

        <label class="full">
          Deskripsi

          <textarea
            id="description"
          ></textarea>

        </label>

      </div>

      <div id="formMessage"></div>

      <div class="actions">

        <button
          id="cancelEditBtn"
          type="button"
          class="secondary hidden"
        >
          Batal edit
        </button>

        <button type="submit">
          Simpan kompetisi
        </button>

      </div>

    </form>


    <!-- DAFTAR KOMPETISI -->
    <section class="panel">

      <h2>
        Daftar kompetisi
      </h2>

      <div id="competitionList">
        <p class="muted">
          Memuat...
        </p>
      </div>

    </section>

  </section>

</main>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/*
  ============================
  KONFIGURASI SUPABASE
  ============================
*/

const SUPABASE_URL =
  "https://ybwxzmqkjeuksylhhskb.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_xrfG7-giWrMWqLTJibk7RQ_18vOUpC8";


const client =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/*
  ============================
  HELPER
  ============================
*/

const $ = id =>
  document.getElementById(id);


/*
  ============================
  ELEMENT
  ============================
*/

const loginPanel =
  $("loginPanel");

const adminPanel =
  $("adminPanel");

const loginForm =
  $("loginForm");

const loginEmail =
  $("loginEmail");

const loginPassword =
  $("loginPassword");

const loginError =
  $("loginError");

const logoutBtn =
  $("logoutBtn");

const competitionForm =
  $("competitionForm");

const competitionList =
  $("competitionList");

const formMessage =
  $("formMessage");

const formTitle =
  $("formTitle");

const cancelEditBtn =
  $("cancelEditBtn");


/*
  ============================
  ESCAPE HTML
  ============================
*/

function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      character => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[character])
    );

}


/*
  ============================
  TAMPILKAN ADMIN
  ============================
*/

function showAdmin(user) {

  loginPanel.classList.add(
    "hidden"
  );

  adminPanel.classList.remove(
    "hidden"
  );

  $("adminEmail").textContent =
    user?.email || "";

}


/*
  ============================
  TAMPILKAN LOGIN
  ============================
*/

function showLogin() {

  adminPanel.classList.add(
    "hidden"
  );

  loginPanel.classList.remove(
    "hidden"
  );

}


/*
  ============================
  CEK SESSION
  ============================
*/

async function checkSession() {

  const {
    data,
    error
  } =
    await client.auth.getSession();


  if (error) {

    loginError.textContent =
      error.message;

    return;

  }


  if (data.session) {

    showAdmin(
      data.session.user
    );

    await loadCompetitions();

  }

  else {

    showLogin();

  }

}


/*
  ============================
  LOGIN
  ============================
*/

loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    loginError.textContent =
      "Sedang masuk...";


    const {
      data,
      error
    } =
      await client.auth.signInWithPassword({

        email:
          loginEmail.value.trim(),

        password:
          loginPassword.value

      });


    if (error) {

      loginError.textContent =
        "Login gagal: " +
        error.message;

      return;

    }


    loginError.textContent =
      "";


    showAdmin(
      data.user
    );


    await loadCompetitions();

  }
);


/*
  ============================
  LOGOUT
  ============================
*/

logoutBtn.addEventListener(
  "click",
  async () => {

    await client.auth.signOut();

    resetForm();

    showLogin();

  }
);


/*
  ============================
  AUTH STATE
  ============================
*/

client.auth.onAuthStateChange(
  (_event, session) => {

    if (session) {

      showAdmin(
        session.user
      );

    }

  }
);


/*
  ============================
  LOAD KOMPETISI
  ============================
*/

async function loadCompetitions() {

  competitionList.innerHTML =
    "<p class='muted'>Memuat...</p>";


  const {
    data,
    error
  } =
    await client
      .from("competitions")
      .select("*")
      .order(
        "deadline",
        {
          ascending: true
        }
      );


  if (error) {

    competitionList.innerHTML =
      "<p class='error'>" +
      escapeHtml(
        error.message
      ) +
      "</p>";

    return;

  }


  if (!data || data.length === 0) {

    competitionList.innerHTML =
      "<p class='muted'>" +
      "Belum ada kompetisi." +
      "</p>";

    return;

  }


  competitionList.innerHTML =
    data.map(
      competition => `

        <div class="item">

          <div>

            <strong>
              ${escapeHtml(
                competition.name
              )}
            </strong>

            <div class="muted">

              ${escapeHtml(
                competition.subject
              )}

              ·

              ${escapeHtml(
                competition.level || ""
              )}

              · Pendaftaran

              ${escapeHtml(
                competition.deadline
              )}

            </div>

          </div>


          <div class="item-actions">

            <button
              type="button"
              class="secondary"
              data-edit="${escapeHtml(
                competition.id
              )}"
            >
              Edit
            </button>


            <button
              type="button"
              class="danger"
              data-delete="${escapeHtml(
                competition.id
              )}"
            >
              Hapus
            </button>

          </div>

        </div>

      `
    ).join("");


  competitionList
    .querySelectorAll(
      "[data-edit]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () =>
            editCompetition(
              button.dataset.edit,
              data
            )
        );

      }
    );


  competitionList
    .querySelectorAll(
      "[data-delete]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () =>
            deleteCompetition(
              button.dataset.delete
            )
        );

      }
    );

}


/*
  ============================
  AMBIL DATA FORM
  ============================
*/

function getFormData() {

  return {

    name:
      $("name").value.trim(),

    subject:
      $("subject").value.trim(),

    level:
      $("level").value.trim(),

    organizer:
      $("organizer").value.trim(),

    deadline:
      $("deadline").value,

    date:
      $("date").value,

    mode:
      $("mode").value,

    fee:
      $("fee").value.trim(),

    poster_url:
      $("posterUrl").value.trim(),

    link:
      $("link").value.trim(),

    description:
      $("description").value.trim()

  };

}


/*
  ============================
  SIMPAN KOMPETISI
  ============================
*/

competitionForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    formMessage.className =
      "muted";

    formMessage.textContent =
      "Menyimpan...";


    const payload =
      getFormData();


    const id =
      $("competitionId").value;


    let result;


    if (id) {

      result =
        await client
          .from("competitions")
          .update(payload)
          .eq("id", id);

    }

    else {

      result =
        await client
          .from("competitions")
          .insert(payload);

    }


    if (result.error) {

      formMessage.className =
        "error";

      formMessage.textContent =
        "Gagal menyimpan: " +
        result.error.message;

      return;

    }


    formMessage.className =
      "success";

    formMessage.textContent =
      "Berhasil disimpan.";


    resetForm();


    await loadCompetitions();

  }
);


/*
  ============================
  EDIT
  ============================
*/

function editCompetition(
  id,
  rows
) {

  const competition =
    rows.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (!competition) {

    return;

  }


  $("competitionId").value =
    competition.id || "";


  $("name").value =
    competition.name || "";


  $("subject").value =
    competition.subject || "";


  $("level").value =
    competition.level || "";


  $("organizer").value =
    competition.organizer || "";


  $("deadline").value =
    competition.deadline || "";


  $("date").value =
    competition.date || "";


  $("mode").value =
    competition.mode ||
    "Daring";


  $("fee").value =
    competition.fee || "";


  $("posterUrl").value =
    competition.poster_url ||
    "";


  $("link").value =
    competition.link || "";


  $("description").value =
    competition.description ||
    "";


  formTitle.textContent =
    "Edit kompetisi";


  cancelEditBtn.classList.remove(
    "hidden"
  );


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/*
  ============================
  RESET FORM
  ============================
*/

function resetForm() {

  competitionForm.reset();


  $("competitionId").value =
    "";


  formTitle.textContent =
    "Tambah kompetisi";


  cancelEditBtn.classList.add(
    "hidden"
  );


  formMessage.textContent =
    "";


  formMessage.className =
    "";

}


cancelEditBtn.addEventListener(
  "click",
  resetForm
);


/*
  ============================
  DELETE
  ============================
*/

async function deleteCompetition(
  id
) {

  const confirmed =
    confirm(
      "Yakin ingin menghapus kompetisi ini?"
    );


  if (!confirmed) {

    return;

  }


  const {
    error
  } =
    await client
      .from("competitions")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "Gagal menghapus: " +
      error.message
    );

    return;

  }


  await loadCompetitions();

}


/*
  ============================
  START
  ============================
*/

checkSession();

</script>

</body>
</html>
