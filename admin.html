<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Admin - Pusat Kompetisi</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#11162a;
  color:white;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header a{
  color:white;
  text-decoration:none;
}

main{
  max-width:1100px;
  margin:30px auto;
  padding:0 20px;
}

.panel{
  background:white;
  border:1px solid #e2e6ee;
  border-radius:16px;
  padding:24px;
  margin-bottom:20px;
}

.hidden{
  display:none!important;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.full{
  grid-column:1/-1;
}

label{
  display:block;
  margin-top:10px;
  font-size:13px;
  font-weight:700;
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  margin-top:6px;
  border:1px solid #dfe3eb;
  border-radius:9px;
  font:inherit;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 15px;
  cursor:pointer;
  font:inherit;
  background:#5b5ce2;
  color:white;
}

button:hover{
  opacity:.9;
}

.secondary{
  background:#eef0f5;
  color:#172033;
}

.danger{
  background:#d33;
}

.actions{
  display:flex;
  gap:10px;
  justify-content:flex-end;
  margin-top:20px;
}

.item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  padding:15px;
  border:1px solid #e2e6ee;
  border-radius:12px;
  margin:12px 0;
}

.item-left{
  display:flex;
  gap:15px;
  align-items:center;
}

.poster-small{
  width:80px;
  height:80px;
  background:#eef0f5;
  border-radius:10px;
  overflow:hidden;
  flex-shrink:0;
}

.poster-small img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.poster-preview img{
  max-width:220px;
  max-height:300px;
  border:1px solid #ddd;
  border-radius:10px;
}

.stage-row{
  display:grid;
  grid-template-columns:2fr 1fr auto;
  gap:10px;
  margin:10px 0;
}

.muted{
  color:#687386;
}

.error{
  color:#c62828;
  margin-top:10px;
}

.success{
  color:#18753c;
  margin-top:10px;
}

@media(max-width:700px){

  .grid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .item{
    flex-direction:column;
    align-items:flex-start;
  }

}

</style>

</head>

<body>

<header>

<strong>
🏆 Pusat Kompetisi - Admin
</strong>

<a href="index.html">
Lihat situs publik
</a>

</header>

<main>

<section
  id="loginPanel"
  class="panel"
>

<h2>
🔐 Login Admin
</h2>

<form id="loginForm">

<label>

Email

<input
  id="loginEmail"
  type="email"
  required
>

</label>

<label>

Password

<input
  id="loginPassword"
  type="password"
  required
>

</label>

<div class="actions">

<button type="submit">

Masuk

</button>

</div>

<div
  id="loginError"
  class="error"
></div>

</form>

</section>

<section
  id="adminPanel"
  class="hidden"
>

<div class="panel">

<div
  style="
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  "
>

<div>

<h2>
Panel Admin
</h2>

<div
  id="adminEmail"
  class="muted"
></div>

</div>

<button
  id="logoutBtn"
  class="secondary"
  type="button"
>

Keluar

</button>

</div>

</div>

<form
  id="competitionForm"
  class="panel"
>

<h2 id="formTitle">

Tambah Kompetisi

</h2>

<input
  id="competitionId"
  type="hidden"
>

<div class="grid">

<label>

Nama Kompetisi

<input
  id="name"
  required
>

</label>

<label>

Bidang

<input
  id="subject"
  required
>

</label>

<label>

Tingkat

<input
  id="level"
>

</label>

<label>

Penyelenggara

<input
  id="organizer"
>

</label>

<label>

Deadline

<input
  id="deadline"
  type="date"
  required
>

</label>

<label>

Mode

<select id="mode">

<option>
Daring
</option>

<option>
Luring
</option>

<option>
Hibrida
</option>

</select>

</label>

<label>

Biaya

<input
  id="fee"
>

</label>

<label class="full">

Link Kompetisi

<input
  id="link"
  type="url"
>

</label>

<label class="full">

Deskripsi

<textarea
  id="description"
></textarea>

</label>

<label class="full">

Poster

<input
  id="posterFile"
  type="file"
  accept="image/jpeg,image/png"
>

</label>

<div
  id="posterPreview"
  class="poster-preview full"
></div>

<div class="full">

<h3>
Tahapan Kompetisi
</h3>

<div id="stagesContainer">

</div>

<button
  id="addStageBtn"
  type="button"
>

+ Tambah Tahap

</button>

</div>

</div>

<div
  id="formMessage"
></div>

<div class="actions">

<button
  id="cancelEditBtn"
  class="secondary hidden"
  type="button"
>

Batal

</button>

<button
  id="saveBtn"
  type="submit"
>

Simpan Kompetisi

</button>

</div>

</form>

<section class="panel">

<h2>

Daftar Kompetisi

</h2>

<div id="competitionList">

Memuat...

</div>

</section>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

const ADMIN_EMAIL="raphael09wijaya@gmail.com";

const client=supabase.createClient(
  "https://ybwxzmqkjeuksylhhskb.supabase.co",
  "sb_publishable_xrfG7-giWrMWqLTJibk7RQ_18vOUpC8"
);

const $=id=>document.getElementById(id);

function addStage(name="",date=""){

  stagesContainer.insertAdjacentHTML(
    "beforeend",
    `
    <div class="stage-row">

      <input
        class="stage-name"
        placeholder="Nama tahap"
        value="${name}"
      >

      <input
        class="stage-date"
        type="date"
        value="${date}"
      >

      <button
        type="button"
        onclick="this.parentElement.remove()"
      >
        X
      </button>

    </div>
    `
  );

}

addStageBtn.onclick=()=>addStage();

function resetForm(){

  competitionForm.reset();

  competitionId.value="";

  posterPreview.innerHTML="";

  stagesContainer.innerHTML="";

  addStage();

  formTitle.textContent=
    "Tambah Kompetisi";

  cancelEditBtn.classList.add(
    "hidden"
  );

}

async function uploadPoster(){

  const file=
    posterFile.files[0];

  if(!file){
    return null;
  }

  const extension=
    file.name.split(".").pop();

  const filename=
    crypto.randomUUID()+
    "."+
    extension;

  const upload=
    await client.storage
      .from("posters")
      .upload(
        filename,
        file
      );

  if(upload.error){

    throw upload.error;

  }

  return client.storage
    .from("posters")
    .getPublicUrl(filename)
    .data
    .publicUrl;

}

let rows=[];

async function loadCompetitions(){

  const result=
    await client
      .from("competitions")
      .select("*")
      .order(
        "deadline",
        {
          ascending:true
        }
      );

  if(result.error){

    competitionList.innerHTML=
      result.error.message;

    return;

  }

  rows=result.data||[];

  if(!rows.length){

    competitionList.innerHTML=
      "Belum ada kompetisi.";

    return;

  }

  competitionList.innerHTML=
    rows.map(
      competition=>`

      <div class="item">

        <div class="item-left">

          ${
            competition.poster_url?

            `
            <div class="poster-small">

              <img
                src="${competition.poster_url}"
              >

            </div>
            `

            :

            ""
          }

          <div>

            <strong>

              ${competition.name}

            </strong>

            <div class="muted">

              ${competition.subject||""}

            </div>

          </div>

        </div>

        <div>

          <button
            onclick="editCompetition('${competition.id}')"
            class="secondary"
          >
            Edit
          </button>

          <button
            onclick="deleteCompetition('${competition.id}')"
            class="danger"
          >
            Hapus
          </button>

        </div>

      </div>

      `
    ).join("");

}

window.editCompetition=function(id){

  const competition=
    rows.find(
      row=>
        String(row.id)===
        String(id)
    );

  if(!competition){
    return;
  }

  competitionId.value=
    competition.id||"";

  name.value=
    competition.name||"";

  subject.value=
    competition.subject||"";

  level.value=
    competition.level||"";

  organizer.value=
    competition.organizer||"";

  deadline.value=
    competition.deadline||"";

  mode.value=
    competition.mode||"Daring";

  fee.value=
    competition.fee||"";

  link.value=
    competition.link||"";

  description.value=
    competition.description||"";

  posterPreview.innerHTML=
    competition.poster_url?

    `
    <img
      src="${competition.poster_url}"
    >
    `

    :

    "";

  stagesContainer.innerHTML="";

  if(
    Array.isArray(
      competition.stages
    )
  ){

    competition.stages.forEach(
      stage=>
        addStage(
          stage.name,
          stage.date
        )
    );

  }else{

    addStage();

  }

  formTitle.textContent=
    "Edit Kompetisi";

  cancelEditBtn.classList.remove(
    "hidden"
  );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

};

window.deleteCompetition=
async function(id){

  if(
    !confirm(
      "Hapus kompetisi?"
    )
  ){
    return;
  }

  const result=
    await client
      .from("competitions")
      .delete()
      .eq("id",id);

  if(result.error){

    alert(
      result.error.message
    );

    return;

  }

  loadCompetitions();

};

posterFile.onchange=()=>{

  const file=
    posterFile.files[0];

  if(!file){
    return;
  }

  posterPreview.innerHTML=
    `
    <img
      src="${
        URL.createObjectURL(
          file
        )
      }"
    >
    `;

};

cancelEditBtn.onclick=
  resetForm;

competitionForm.onsubmit=
async event=>{

  event.preventDefault();

  try{

    const poster=
      await uploadPoster();

    const stages=
      [
        ...document.querySelectorAll(
          ".stage-row"
        )
      ]
      .map(
        row=>({

          name:
            row.querySelector(
              ".stage-name"
            ).value,

          date:
            row.querySelector(
              ".stage-date"
            ).value

        })
      )
      .filter(
        stage=>
          stage.name&&
          stage.date
      );

    const payload={

      name:name.value,

      subject:subject.value,

      level:level.value,

      organizer:organizer.value,

      deadline:deadline.value,

      mode:mode.value,

      fee:fee.value,

      link:link.value,

      description:description.value,

      stages:stages

    };

    if(poster){

      payload.poster_url=
        poster;

    }

    let result;

    if(competitionId.value){

      result=
        await client
          .from("competitions")
          .update(payload)
          .eq(
            "id",
            competitionId.value
          );

    }else{

      result=
        await client
          .from("competitions")
          .insert(payload);

    }

    if(result.error){

      throw result.error;

    }

    formMessage.className=
      "success";

    formMessage.textContent=
      "Berhasil disimpan.";

    resetForm();

    loadCompetitions();

  }

  catch(error){

    formMessage.className=
      "error";

    formMessage.textContent=
      error.message;

  }

};

loginForm.onsubmit=
async event=>{

  event.preventDefault();

  const login=
    await client.auth
      .signInWithPassword({

        email:
          loginEmail.value,

        password:
          loginPassword.value

      });

  if(login.error){

    loginError.textContent=
      login.error.message;

    return;

  }

  if(
    login.data.user.email
    !==
    ADMIN_EMAIL
  ){

    await client.auth.signOut();

    loginError.textContent=
      "Bukan admin.";

    return;

  }

  loginPanel.classList.add(
    "hidden"
  );

  adminPanel.classList.remove(
    "hidden"
  );

  adminEmail.textContent=
    login.data.user.email;

  loadCompetitions();

};

logoutBtn.onclick=
async()=>{

  await client.auth.signOut();

  location.reload();

};

(async()=>{

  const session=
    await client.auth
      .getSession();

  if(

    session.data.session&&

    session
      .data
      .session
      .user
      .email===ADMIN_EMAIL

  ){

    loginPanel.classList.add(
      "hidden"
    );

    adminPanel.classList.remove(
      "hidden"
    );

    adminEmail.textContent=
      session
        .data
        .session
        .user
        .email;

    loadCompetitions();

  }

})();

</script>

</body>

</html>
