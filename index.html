<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pusat Kompetisi</title>
<style>
body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}header{background:#11162a;color:#fff;padding:24px 6%;display:flex;justify-content:space-between;align-items:center}main{max-width:1200px;margin:30px auto;padding:0 20px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select,button{padding:10px;border-radius:9px;border:1px solid #dfe3eb;background:#fff}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.card{background:#fff;border:1px solid #e3e7ee;border-radius:15px;overflow:hidden;cursor:pointer}.poster{height:150px;background:#e9eaff;display:flex;align-items:center;justify-content:center}.poster img{width:100%;height:100%;object-fit:cover}.body{padding:15px}.tag{display:inline-block;background:#eef0ff;color:#4f51bd;padding:4px 8px;border-radius:20px;font-size:12px;margin:3px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.box{background:white;max-width:850px;width:100%;max-height:90vh;overflow:auto;border-radius:18px;padding:25px}.close{float:right}.muted{color:#697386}
</style></head>
<body>
<header><b>🏆 Pusat Kompetisi</b><a href="admin.html" style="color:white">Admin</a></header>
<main><h1>Kompetisi Mendatang</h1><p class="muted">Temukan dan jelajahi berbagai kompetisi.</p>
<div class="tools"><input id="q" placeholder="🔍 Cari kompetisi..." oninput="render()"><select id="subject" onchange="render()"><option value="">Semua bidang</option></select><select id="sort" onchange="render()"><option value="deadline">Batas pendaftaran terdekat</option><option value="date">Tanggal kompetisi</option><option value="name">Nama</option></select></div>
<div id="grid" class="grid"></div></main>
<div id="modal" class="modal" onclick="if(event.target===this)this.classList.remove('show')"><div id="box" class="box"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CONFIG={url:"GANTI_SUPABASE_URL",key:"GANTI_SUPABASE_ANON_KEY"};
const db=supabase.createClient(CONFIG.url,CONFIG.key); let rows=[];
async function load(){let {data,error}=await db.from("competitions").select("*").order("deadline");if(error){grid.innerHTML="<p>Belum terhubung ke database.</p>";return}rows=data||[];let s=[...new Set(rows.map(x=>x.subject))].sort();subject.innerHTML='<option value="">Semua bidang</option>'+s.map(x=>`<option>${esc(x)}</option>`).join("");render()}
function esc(x=""){return x.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){let q=document.getElementById("q").value.toLowerCase(),sub=subject.value,sort=document.getElementById("sort").value;a=rows.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!sub||x.subject===sub));a.sort((x,y)=>sort==="name"?x.name.localeCompare(y.name):new Date(x[sort])-new Date(y[sort]));grid.innerHTML=a.map(c=>`<article class="card" onclick="openC('${c.id}')"><div class="poster">${c.poster_url?`<img src="${esc(c.poster_url)}">`:"🏆"}</div><div class="body"><b>${esc(c.name)}</b><p class="muted">${esc(c.organizer||"")} · ${esc(c.level||"")}</p><span class="tag">${esc(c.subject)}</span><span class="tag">${esc(c.mode||"")}</span><p>📅 Pendaftaran: ${new Date(c.deadline).toLocaleDateString("id-ID")}</p></div></article>`).join("")||"<p>Tidak ada kompetisi.</p>"}
function openC(id){let c=rows.find(x=>x.id===id);box.innerHTML=`<button class="close" onclick="modal.classList.remove('show')">✕</button><h2>${esc(c.name)}</h2>${c.poster_url?`<img src="${esc(c.poster_url)}" style="width:100%;max-height:500px;object-fit:contain">`:""}<p>${esc(c.description||"")}</p><p><b>Bidang:</b> ${esc(c.subject)}<br><b>Tingkat:</b> ${esc(c.level||"")}<br><b>Penyelenggara:</b> ${esc(c.organizer||"")}<br><b>Pendaftaran:</b> ${new Date(c.deadline).toLocaleDateString("id-ID")}<br><b>Kompetisi:</b> ${new Date(c.date).toLocaleDateString("id-ID")}<br><b>Mode:</b> ${esc(c.mode||"")}<br><b>Biaya:</b> ${esc(c.fee||"")}</p>${c.link?`<a href="${esc(c.link)}" target="_blank">🔗 Buka halaman pendaftaran</a>`:""}`;modal.classList.add("show")}
load();
</script></body></html>
