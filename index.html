<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pusat Kompetisi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #11162a;
      color: white;
      padding: 22px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header a {
      color: white;
      text-decoration: none;
    }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .hero {
      background: white;
      padding: 30px;
      border-radius: 18px;
      margin-bottom: 25px;
      border: 1px solid #e2e6ee;
    }

    .hero h2 {
      margin-top: 0;
      font-size: 32px;
    }

    .filters {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #dce1ea;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    #list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .competition-card {
      background: white;
      border: 1px solid #e2e6ee;
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .competition-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .poster {
      width: 100%;
      height: 240px;
      background: #eef0f5;
      overflow: hidden;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 18px;
    }

    .card-content h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .card-content p {
      color: #5f697b;
      line-height: 1.5;
      margin: 7px 0;
    }

    .card-content a {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 14px;
      background: #5b5ce2;
      color: white;
      border-radius: 9px;
      text-decoration: none;
    }

    .loading,
    .empty,
    .error {
      background: white;
      padding: 25px;
      border-radius: 14px;
      text-align: center;
      grid-column: 1 / -1;
    }

    .error {
      color: #c62828;
    }

    @media (max-width: 900px) {
      #list {
        grid-template-columns: repeat(2, 1fr);
      }

      .filters {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 18px;
      }

      .hero h2 {
        font-size: 25px;
      }

      #list {
        grid-template-columns: 1fr;
      }

      .filters {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <h1>🏆 Pusat Kompetisi</h1>

  <a href="admin.html">
    Admin
  </a>

</header>


<main>

  <section class="hero">

    <h2>
      Temukan Kompetisi
    </h2>

    <p>
      Daftar berbagai kompetisi akademik dan non-akademik
      yang dapat kamu ikuti.
    </p>

  </section>


  <!-- FILTER -->

  <section class="filters">

    <input
      id="search"
      type="search"
      placeholder="🔎 Cari kompetisi..."
    >

    <select id="subjectFilter">

      <option value="">
        Semua bidang
      </option>

    </select>


    <select id="levelFilter">

      <option value="">
        Semua tingkat
      </option>

    </select>


    <select id="modeFilter">

      <option value="">
        Semua mode
      </option>

      <option value="Daring">
        Daring
      </option>

      <option value="Luring">
        Luring
      </option>

      <option value="Hibrida">
        Hibrida
      </option>

    </select>

  </section>


  <!-- DAFTAR KOMPETISI -->

  <section id="list">

    <div class="loading">
      Memuat kompetisi...
    </div>

  </section>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

"use strict";


/*
========================================
SUPABASE
========================================
*/

const SUPABASE_URL =
  "https://ybwxzmqkjeuksylhhskb.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_xrfG7-giWrMWqLTJibk7RQ_18vOUpC8";


const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/*
========================================
HELPER
========================================
*/

function escapeHtml(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      character => ({

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      }[character])
    );

}


function formatDate(value) {

  if (!value) {
    return "-";
  }

  const date =
    new Date(
      String(value).length === 10
        ? value + "T00:00:00"
        : value
    );


  if (isNaN(date)) {
    return value;
  }


  return date.toLocaleDateString(
    "id-ID",
    {
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

}


/*
========================================
LOAD DATA
========================================
*/

async function loadCompetitions() {

  const list =
    document.getElementById("list");


  list.innerHTML = `
    <div class="loading">
      Memuat kompetisi...
    </div>
  `;


  const {
    data,
    error
  } =
    await db
      .from("competitions")
      .select("*")
      .order(
        "deadline",
        {
          ascending: true
        }
      );


  /*
  ERROR
  */

  if (error) {

    console.error(
      "Supabase error:",
      error
    );


    list.innerHTML = `
      <div class="error">

        Gagal memuat kompetisi.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>
    `;

    return;

  }


  /*
  KOSONG
  */

  if (
    !data ||
    data.length === 0
  ) {

    list.innerHTML = `
      <div class="empty">

        Belum ada kompetisi
        yang tersedia.

      </div>
    `;

    return;

  }


  /*
  FILTER OPTIONS
  */

  createFilters(data);


  /*
  CARD
  */

  list.innerHTML =
    data.map(
      competition => {

        return `

          <article
            class="competition-card"

            data-subject="${escapeHtml(
              competition.subject || ""
            )}"

            data-level="${escapeHtml(
              competition.level || ""
            )}"

            data-mode="${escapeHtml(
              competition.mode || ""
            )}"
          >


            ${
              competition.poster_url
                ?

              `

              <div class="poster">

                <img

                  src="${escapeHtml(
                    competition.poster_url
                  )}"

                  alt="Poster ${escapeHtml(
                    competition.name
                  )}"

                  loading="lazy"

                >

              </div>

              `

                : ""

            }


            <div class="card-content">


              <h3>

                ${escapeHtml(
                  competition.name
                )}

              </h3>


              ${
                competition.subject
                  ?

                  `<p>
                    📚 ${escapeHtml(
                      competition.subject
                    )}
                  </p>`

                  : ""
              }


              ${
                competition.level
                  ?

                  `<p>
                    🏅 ${escapeHtml(
                      competition.level
                    )}
                  </p>`

                  : ""
              }


              ${
                competition.organizer
                  ?

                  `<p>
                    🏢 ${escapeHtml(
                      competition.organizer
                    )}
                  </p>`

                  : ""
              }


              ${
                competition.deadline
                  ?

                  `<p>
                    ⏳ Pendaftaran:
                    ${formatDate(
                      competition.deadline
                    )}
                  </p>`

                  : ""
              }


              ${
                competition.date
                  ?

                  `<p>
                    📅 Kompetisi:
                    ${formatDate(
                      competition.date
                    )}
                  </p>`

                  : ""
              }


              ${
                competition.mode
                  ?

                  `<p>
                    💻 ${escapeHtml(
                      competition.mode
                    )}
                  </p>`

                  : ""
              }


              ${
                competition.fee
                  ?

                  `<p>
                    💰 ${escapeHtml(
                      competition.fee
                    )}
                  </p>`

                  : ""
              }


              ${
                competition.description
                  ?

                  `<p>
                    ${escapeHtml(
                      competition.description
                    )}
                  </p>`

                  : ""
              }


              ${
                competition.link
                  ?

                  `

                  <a

                    href="${escapeHtml(
                      competition.link
                    )}"

                    target="_blank"

                    rel="noopener noreferrer"

                  >

                    Daftar / Lihat Kompetisi

                  </a>

                  `

                  : ""

              }


            </div>

          </article>

        `;

      }
    )
    .join("");


  setupSearch();

}


/*
========================================
BUAT FILTER OTOMATIS
========================================
*/

function createFilters(data) {

  const subjectFilter =
    document.getElementById(
      "subjectFilter"
    );


  const levelFilter =
    document.getElementById(
      "levelFilter"
    );


  /*
  SUBJECT
  */

  const subjects =
    [
      ...new Set(
        data
          .map(
            item =>
              item.subject
          )
          .filter(Boolean)
      )
    ]
    .sort();


  subjectFilter.innerHTML = `

    <option value="">
      Semua bidang
    </option>

    ${
      subjects
        .map(
          subject => `

            <option
              value="${escapeHtml(
                subject
              )}"
            >

              ${escapeHtml(
                subject
              )}

            </option>

          `
        )
        .join("")
    }

  `;


  /*
  LEVEL
  */

  const levels =
    [
      ...new Set(
        data
          .map(
            item =>
              item.level
          )
          .filter(Boolean)
      )
    ]
    .sort();


  levelFilter.innerHTML = `

    <option value="">
      Semua tingkat
    </option>

    ${
      levels
        .map(
          level => `

            <option
              value="${escapeHtml(
                level
              )}"
            >

              ${escapeHtml(
                level
              )}

            </option>

          `
        )
        .join("")
    }

  `;

}


/*
========================================
SEARCH & FILTER
========================================
*/

function setupSearch() {

  const search =
    document.getElementById(
      "search"
    );


  const subject =
    document.getElementById(
      "subjectFilter"
    );


  const level =
    document.getElementById(
      "levelFilter"
    );


  const mode =
    document.getElementById(
      "modeFilter"
    );


  function applyFilters() {

    const query =
      search.value
        .toLowerCase()
        .trim();


    const selectedSubject =
      subject.value
        .toLowerCase();


    const selectedLevel =
      level.value
        .toLowerCase();


    const selectedMode =
      mode.value
        .toLowerCase();


    document
      .querySelectorAll(
        ".competition-card"
      )
      .forEach(
        card => {

          const text =
            card.textContent
              .toLowerCase();


          const cardSubject =
            (
              card.dataset.subject ||
              ""
            )
            .toLowerCase();


          const cardLevel =
            (
              card.dataset.level ||
              ""
            )
            .toLowerCase();


          const cardMode =
            (
              card.dataset.mode ||
              ""
            )
            .toLowerCase();


          const matchesSearch =
            !query ||
            text.includes(
              query
            );


          const matchesSubject =
            !selectedSubject ||
            cardSubject ===
              selectedSubject;


          const matchesLevel =
            !selectedLevel ||
            cardLevel ===
              selectedLevel;


          const matchesMode =
            !selectedMode ||
            cardMode ===
              selectedMode;


          if (
            matchesSearch &&
            matchesSubject &&
            matchesLevel &&
            matchesMode
          ) {

            card.style.display =
              "";

          }

          else {

            card.style.display =
              "none";

          }

        }
      );

  }


  search.addEventListener(
    "input",
    applyFilters
  );


  subject.addEventListener(
    "change",
    applyFilters
  );


  level.addEventListener(
    "change",
    applyFilters
  );


  mode.addEventListener(
    "change",
    applyFilters
  );

}


/*
========================================
START
========================================
*/

document.addEventListener(
  "DOMContentLoaded",
  loadCompetitions
);

</script>

</body>
</html>
